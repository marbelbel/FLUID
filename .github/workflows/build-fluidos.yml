
name: Construir FluidOS ISO en la Nube

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-freebsd-iso:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. PREPARAR REPOSITORIO
      # ============================================================

      - name: Preparar archivos del repositorio
        uses: actions/checkout@v4

      # ============================================================
      # 2. CONSTRUIR FLUIDOS EN FREEBSD
      # ============================================================

      - name: Ejecutar construccion dentro de FreeBSD 14.5
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          mem: 4G
          usesh: true
          sync: rsync
          copyback: true

          run: |
            set -e

            echo "[INFO] Comprobando entorno..."
            freebsd-version
            uname -m

            RUTA=$(find "$GITHUB_WORKSPACE" \
              -name "build-os.sh" \
              -print -quit | xargs dirname)

            cd "$RUTA"

            echo "[INFO] Preparando scripts..."
            sed -i '' 's/\r$//' ./*.sh
            chmod +x ./*.sh

            echo "[INFO] Construyendo sistema base..."
            ./build-os.sh

            echo "[INFO] Configurando caracteristicas..."
            ./setup-features.sh

            echo "[INFO] Generando ISO..."
            ./make-iso.sh

            echo "[INFO] Comprobando ISO..."
            test -s fluidos-14.0-amd64.iso

            ls -lh fluidos-14.0-amd64.iso

      # ============================================================
      # 3. COMPRIMIR Y PREPARAR ISO
      # ============================================================

      - name: Comprimir y preparar ISO para distribucion
        shell: bash
        run: |
          set -euo pipefail

          echo "[INFO] Localizando ISO..."

          ISO=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "fluidos-14.0-amd64.iso" \
            -print -quit)

          if [ -z "$ISO" ]; then
            echo "[ERROR] No se encontro la ISO."
            exit 1
          fi

          test -s "$ISO"

          mkdir -p "$GITHUB_WORKSPACE/release-assets"

          cp "$ISO" "$GITHUB_WORKSPACE/release-assets/"

          cd "$GITHUB_WORKSPACE/release-assets"

          echo "[INFO] Comprimiendo FluidOS con XZ..."

          xz -T0 -6 -k fluidos-14.0-amd64.iso

          COMPRESSED="fluidos-14.0-amd64.iso.xz"

          SIZE=$(stat -c%s "$COMPRESSED")
          LIMIT=2147483648

          echo "[INFO] Tamaño comprimido: $SIZE bytes"

          echo "[INFO] Generando SHA256..."

          sha256sum "$COMPRESSED" > "$COMPRESSED.sha256"

          if [ "$SIZE" -ge "$LIMIT" ]; then

            echo "[INFO] La ISO comprimida supera 2 GiB."
            echo "[INFO] Dividiendo automaticamente..."

            split -b 1900M -d -a 3 \
              "$COMPRESSED" \
              "$COMPRESSED.part"

            rm "$COMPRESSED"

          else

            echo "[SUCCESS] ISO compatible con GitHub Releases."

          fi

          echo "[INFO] Archivos preparados:"
          ls -lh

      # ============================================================
      # 4. VERIFICAR ARCHIVOS
      # ============================================================

      - name: Verificar archivos de distribucion
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/release-assets"

          echo "[INFO] Comprobando archivos..."

          test -f "fluidos-14.0-amd64.iso.xz.sha256"

          if [ -f "fluidos-14.0-amd64.iso.xz" ]; then

            echo "[INFO] Comprobando SHA256..."
            sha256sum -c fluidos-14.0-amd64.iso.xz.sha256

          else

            echo "[INFO] ISO dividida en partes."

            cat fluidos-14.0-amd64.iso.xz.part* \
              > /tmp/fluidos-check.iso.xz

            sha256sum -c \
              <(sed "s|fluidos-14.0-amd64.iso.xz|/tmp/fluidos-check.iso.xz|" \
              fluidos-14.0-amd64.iso.xz.sha256)

            rm /tmp/fluidos-check.iso.xz

          fi

          echo "[SUCCESS] Verificacion completada."

      # ============================================================
      # 5. PUBLICAR EN GITHUB RELEASES
      # ============================================================

      - name: Publicar FluidOS en GitHub Releases
        uses: softprops/action-gh-release@v2

        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          tag_name: v1.0-beta
          name: FluidOS 1.0 Beta

          generate_release_notes: true
          overwrite_files: true

          body: |
            # FluidOS 1.0 Beta

            Primera compilacion distribuible de FluidOS.

            ## Descarga

            Descarga el archivo ISO.XZ.

            Si existen partes:
            1. Descarga todas las partes.
            2. Unelas en orden numerico.
            3. Recupera el archivo ISO.XZ.
            4. Descomprime utilizando XZ.

            ## Verificacion

            Utiliza el archivo SHA256 para comprobar
            la integridad de la descarga.

          files: |
            release-assets/*

          fail_on_unmatched_files: true
          
