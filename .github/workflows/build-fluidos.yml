
name: Construir FluidOS ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-freebsd-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir FluidOS dentro de FreeBSD 14.2
        id: build
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          mem: 4096
          sync: rsync
          copyback: true
          run: |
            set -e

            echo "[INFO] Comprobando entorno..."
            freebsd-version
            uname -m

            cd "$GITHUB_WORKSPACE"

            echo "[INFO] Preparando scripts..."
            sed -i '' 's/\r$//' ./*.sh
            chmod +x ./*.sh

            echo "[INFO] Construyendo sistema base..."
            ./build-os.sh

            echo "[INFO] Instalando características de FluidOS..."
            ./setup-features.sh

            echo "[INFO] Generando imagen ISO..."
            ./make-iso.sh

            echo "[INFO] Comprobando ISO..."
            test -s fluidos-14.0-amd64.iso

            ls -lh fluidos-14.0-amd64.iso

      - name: Publicar FluidOS en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-beta
          name: FluidOS 1.0 Beta
          generate_release_notes: true
          files: fluidos-*.iso
          
