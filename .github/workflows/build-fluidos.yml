
name: Construir FluidOS ISO en la Nube

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-freebsd-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar archivos del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar construccion dentro de FreeBSD 14.5
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.5'
          mem: 4G
          usesh: true
          sync: rsync
          copyback: true

          run: |
            set -e

            echo "[INFO] Comprobando entorno..."
            freebsd-version
            uname -m

            RUTA=$(find "$GITHUB_WORKSPACE" -name "build-os.sh" | head -n 1 | xargs dirname)

            cd "$RUTA"

            echo "[INFO] Preparando scripts..."
            sed -i '' 's/\r$//' ./*.sh
            chmod +x ./*.sh

            echo "[INFO] Construyendo sistema base..."
            ./build-os.sh

            echo "[INFO] Configurando caracteristicas de FluidOS..."
            ./setup-features.sh

            echo "[INFO] Generando ISO..."
            ./make-iso.sh

            echo "[INFO] Comprobando imagen ISO..."
            test -s fluidos-14.0-amd64.iso

            ls -lh fluidos-14.0-amd64.iso

      - name: Publicar FluidOS en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-beta
          name: FluidOS 1.0 Beta
          generate_release_notes: true
          files: fluidos-*.iso
          
